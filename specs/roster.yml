# Central team roster (spec §4.3): the only place channels are defined.
# People are referenced everywhere by their key here (name-only); a name missing
# from this file fails loudly rather than silently. Slack is used if present,
# else email. For reliable DMs use a Slack member ID (U…); use #channel for groups.
people:
  chris:   { email: chris@acme.com, slack: "U01ABC123" }
  elena:   { email: elena@acme.com, slack: "U02DEF456" }
  sam:     { email: sam@acme.com }        # email only is fine
  qa-team: { slack: "#qa" }               # a channel is fine; email optional
