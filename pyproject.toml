[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hureva"
version = "1.0.0"
description = "Spec review & approval workflow: frontmatter contract, transition detection, role→person→channel routing, and a status gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "growth-beaker" }]
keywords = ["spec", "review", "approval", "workflow", "github-actions", "frontmatter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/growth-beaker/hureva"
Repository = "https://github.com/growth-beaker/hureva"

[project.optional-dependencies]
slack = ["slack_sdk>=3"]
dev = ["pytest>=8", "slack_sdk>=3"]

[project.scripts]
hureva-init = "hureva.init_repo:main"
hureva-notify = "hureva.notify:main"
hureva-gate = "hureva.gate:main"
hureva-new-spec = "hureva.new_spec:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
