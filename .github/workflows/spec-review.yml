# Spec review & approval — self-contained: specs, this workflow, and the hureva
# package all live in this repo.
#
# On a push to a spec branch, gate the changed specs and notify their reviewers.
# `pip install .` installs the in-repo package (no external repo reference; only
# pydantic/pyyaml come from PyPI). The only knobs are the specs path (two
# `--specs-dir` values) and whether to flip the gate to enforced.
name: spec-review

on:
  push:
    branches: ["spec/**"]     # status changes happen on spec branches (§7.4)
    paths: ["specs/**"]       # ...and only when something under specs/ changed

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # both push commits reachable for transition detection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .          # the hureva package lives in this repo
      # Advisory by default. Add --enforced to block un-approved specs (§6.3),
      # and make this job a required check with branch protection.
      - run: python -m hureva.gate --changed --specs-dir specs

  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .          # the hureva package lives in this repo
      - run: python -m hureva.notify --specs-dir specs
        env:
          # A channel is used only if its secret is set (Slack-only teams set just
          # SLACK_BOT_TOKEN). The runner provides GITHUB_EVENT_PATH automatically.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
