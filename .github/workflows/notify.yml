# Reusable "notify" workflow (spec §7, §13.7).
#
# A tenant repo calls this on push to its specs. It checks out the *caller's*
# repo (the specs live there), installs the hureva core library from this central
# product repo at a pinned ref, and runs `python -m hureva.notify`, which detects
# the frontmatter status transition and routes notifications by role → person →
# channel. The Action is a thin wrapper; all logic is in the library.
name: notify

on:
  workflow_call:
    inputs:
      specs_dir:
        description: "Root folder for specs (matches the caller's layout)."
        type: string
        default: specs
      lib_ref:
        description: "Git ref of the hureva library to install (pin with the caller)."
        type: string
        default: v1
      dry_run:
        description: "Detect + route + log, but do not deliver."
        type: boolean
        default: false
    secrets:
      SLACK_BOT_TOKEN:
        required: false
      SMTP_HOST:
        required: false
      SMTP_PORT:
        required: false
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      SMTP_FROM:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the push's `before` and `after` commits are both
      # reachable for two-commit transition detection (spec §7.4).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hureva core library
        run: pip install "hureva @ git+https://github.com/growth-beaker/hureva.git@${{ inputs.lib_ref }}"

      - name: Notify
        run: >
          python -m hureva.notify
          --specs-dir "${{ inputs.specs_dir }}"
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # notify reads the push event (before/after SHAs) from here automatically.
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
